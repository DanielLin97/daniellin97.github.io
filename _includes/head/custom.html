{% include base_path %}

<!-- start custom head snippets -->

<!-- Branded LHZ monogram favicon -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=3"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<style>
  .site-brand--editorial, .academic-footer, .mentorship-opportunity__eyebrow { display: none !important; }
  html[data-site-variant="editorial"] .site-brand--classic { display: none !important; }
  html[data-site-variant="editorial"] .site-brand--editorial { display: inline-flex !important; }
  html[data-site-variant="editorial"] .academic-footer { display: flex !important; }
  html[data-site-variant="editorial"] .mentorship-opportunity__eyebrow { display: block !important; }
</style>
<script>
  (function () {
    var forcedVariant = "{{ page.site_variant | default: '' }}";
    if (forcedVariant) {
      sessionStorage.setItem("siteVariant", forcedVariant);
    }

    var variant = forcedVariant || sessionStorage.getItem("siteVariant") || "classic";
    document.documentElement.setAttribute("data-site-variant", variant);

    if (variant === "editorial") {
      document.write('<link rel="stylesheet" href="{{ base_path }}/assets/css/editorial.css?v=20261007-1">');
    }
  }());
</script>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
