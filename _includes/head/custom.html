{% include base_path %}

<!-- start custom head snippets -->

<style>
  .site-brand--editorial, .academic-footer { display: none !important; }
  html[data-site-variant="editorial"] .site-brand--classic { display: none !important; }
  html[data-site-variant="editorial"] .site-brand--editorial { display: inline-flex !important; }
  html[data-site-variant="editorial"] .academic-footer { display: flex !important; }
</style>
<script>
  (function () {
    var forcedVariant = "{{ page.site_variant | default: '' }}";
    var variant = forcedVariant || "editorial";

    try {
      if (forcedVariant) {
        sessionStorage.setItem("siteVariant", forcedVariant);
      } else {
        variant = sessionStorage.getItem("siteVariant") || "editorial";
      }
    } catch (error) {
      variant = forcedVariant || "editorial";
    }

    document.documentElement.setAttribute("data-site-variant", variant);

    if (variant === "editorial") {
      document.write('<link rel="preconnect" href="https://fonts.googleapis.com">');
      document.write('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
      document.write('<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">');
      document.write('<link rel="stylesheet" href="{{ base_path }}/assets/css/editorial.css?v=20261007-2">');
    } else {
      document.write('<link rel="stylesheet" href="{{ base_path }}/assets/css/classic.css?v=20261007-3">');
    }
  }());
</script>

<!-- Branded LHZ monogram favicon -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=3"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#173f59"/>

{% if page.site_variant == 'editorial' %}
<link rel="preload" as="image" href="{{ base_path }}/images/homepage-profile.webp" type="image/webp" fetchpriority="high">
{% endif %}

{% if page.author_profile %}<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>{% endif %}

<!-- MathJax only on pages that opt in with `mathjax: true` -->
{% if page.mathjax %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
