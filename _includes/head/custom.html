{% include base_path %}

<!-- start custom head snippets -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<!-- Branded HL monogram favicon -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=2"/>
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#173f59"/>

{% if page.url == '/' %}
<link rel="preload" as="image" href="{{ base_path }}/images/homepage-profile.webp" type="image/webp" fetchpriority="high">
{% endif %}

{% if page.author_profile %}<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>{% endif %}

<!-- MathJax only on pages that opt in with `mathjax: true` -->
{% if page.mathjax %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
